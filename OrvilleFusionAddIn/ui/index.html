<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orville</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <img class="brand-logo" src="../resources/orville.png" alt="Orville">
        <div class="brand-text">
          <h1>Orville</h1>
          <p id="connection-state">Connecting...</p>
        </div>
        <button id="change-key-button" type="button" class="secondary compact header-key-button">API key</button>
      </header>

      <section class="settings" aria-label="API key settings">
        <div id="key-form" class="key-form">
          <label for="api-key-input">API key</label>
          <div class="key-row">
          <input id="api-key-input" type="password" autocomplete="off" placeholder="gcad_live_...">
          <button id="save-key-button" type="button">Save</button>
          <button id="delete-key-button" type="button" class="secondary">Delete</button>
          </div>
        </div>
      </section>

      <section class="status-strip" aria-live="polite">
        <span id="job-status">No active job</span>
        <div class="status-actions">
          <button id="new-job-button" type="button" class="secondary compact">New job</button>
          <button id="refresh-button" type="button" class="secondary compact">Refresh</button>
        </div>
      </section>

      <section id="messages" class="messages" aria-label="Conversation"></section>

      <section class="recent" aria-label="Recent jobs">
        <div class="recent-header">
          <button id="recent-toggle-button" type="button" class="secondary compact">Recent Jobs</button>
          <button id="recent-refresh-button" type="button" class="secondary compact">Refresh</button>
        </div>
        <div id="recent-body" class="recent-body">
          <div class="recent-search">
            <input id="recent-search-input" type="search" placeholder="Search jobs">
            <button id="recent-search-button" type="button" class="secondary compact">Search</button>
            <button id="recent-clear-button" type="button" class="secondary compact">Clear search</button>
          </div>
          <div id="recent-list" class="recent-list" role="list"></div>
        </div>
      </section>

      <section id="artifacts" class="artifacts" aria-label="STEP artifacts">
        <div class="artifacts-header">
          <button id="artifacts-toggle-button" type="button" class="secondary compact">STEP Artifacts</button>
        </div>
        <div id="artifacts-body" class="artifacts-body"></div>
      </section>

      <section class="composer" aria-label="Prompt composer">
        <div class="mode-row" aria-label="Request mode">
          <span>Mode</span>
          <div class="segmented" role="group" aria-label="Review or iterate">
            <button id="iterate-mode-button" type="button" class="active">Iterate</button>
            <button id="review-mode-button" type="button">Review</button>
          </div>
        </div>
        <div id="image-list" class="image-list"></div>
        <textarea id="prompt-input" rows="4" placeholder="Describe the CAD model or the change you want..."></textarea>
        <div class="composer-actions">
          <button id="attach-button" type="button" class="secondary">Attach images</button>
          <button id="clear-images-button" type="button" class="secondary">Clear images</button>
          <button id="submit-button" type="button">Create</button>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
